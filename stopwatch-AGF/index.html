<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cronómetro & Cuenta Atrás</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="hero">
    <h1>Gestión del Tiempo</h1>
    <p>Controla tu tiempo con precisión. Usa el cronómetro o configura una cuenta atrás personalizada.</p>
  </div>

  <div class="tabs-wrapper">
    <div class="tabs" role="tablist">
      <button class="tab active" id="tab-stopwatch" role="tab" aria-selected="true" aria-controls="panel-stopwatch">
        <span class="tab-icon">⏱</span> Cronómetro
      </button>
      <button class="tab" id="tab-countdown" role="tab" aria-selected="false" aria-controls="panel-countdown">
        <span class="tab-icon">⏳</span> Cuenta atrás
      </button>
    </div>
  </div>

  <main class="main">

    <section class="panel" id="panel-stopwatch" role="tabpanel" aria-labelledby="tab-stopwatch">
      <div class="card">
        <p class="card-label">Cronómetro</p>
        <div class="display" id="stopwatch-display">00:00:00</div>
        <div class="controls">
          <button class="btn btn-primary" id="sw-start">Iniciar</button>
          <button class="btn btn-secondary" id="sw-stop">Finalizar</button>
          <button class="btn btn-ghost" id="sw-reset">Reiniciar</button>
        </div>
      </div>
    </section>

    <section class="panel hidden" id="panel-countdown" role="tabpanel" aria-labelledby="tab-countdown">
      <div class="card">
        <p class="card-label">Cuenta atrás</p>
        <div class="countdown-setup" id="cd-setup">
          <label for="cd-minutes">Minutos</label>
          <input type="number" id="cd-minutes" min="1" max="999999" placeholder="Ej. 90" />
          <span class="input-error hidden" id="cd-error">Introduce un número válido (mínimo 1)</span>
          <button class="btn btn-primary full-width" id="cd-start">Iniciar cuenta atrás</button>
        </div>
        <div class="countdown-running hidden" id="cd-running">
          <div class="display" id="countdown-display">00:00:00</div>
          <p class="status-msg hidden" id="cd-finished">¡Tiempo finalizado!</p>
          <div class="controls">
            <button class="btn btn-secondary" id="cd-stop">Detener</button>
            <button class="btn btn-ghost" id="cd-back">Nueva cuenta atrás</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <p>Hecho con HTML, CSS y JavaScript · Sin dependencias externas</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
